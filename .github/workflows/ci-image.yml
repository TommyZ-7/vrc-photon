name: CI Image

on:
  push:
    branches: [main, ci/591-ci-container]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/ci-image.yml
  schedule:
    # Rebuild monthly so Ubuntu security updates reach the shared image.
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/tommyz-7/vrc-photon-ci:ubuntu-24.04-v1
          labels: org.opencontainers.image.source=https://github.com/TommyZ-7/vrc-photon
          cache-from: type=gha
          cache-to: type=gha,mode=max
